<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#edBg)"/>

  <text x="540" y="140" font-family="system-ui" font-size="44" font-weight="700"
        fill="white" text-anchor="middle">اكتب كما تشاء ✍️</text>
  <text x="540" y="190" font-family="system-ui" font-size="24"
        fill="#8B95A8" text-anchor="middle">نص + صور + صوت + تحويل صوتي</text>

  <g transform="translate(90, 240)">
    <rect width="900" height="1600" rx="40" fill="#0A0D14" stroke="#252B3A" stroke-width="3"/>

    <!-- Header -->
    <rect x="0" y="0" width="900" height="100" rx="40" fill="#141821"/>
    <text x="450" y="62" font-family="system-ui" font-size="28" fill="white"
          text-anchor="middle" font-weight="600">Edit Entry</text>

    <!-- Mood Bar -->
    <g transform="translate(40, 140)">
      <rect width="260" height="70" rx="35" fill="#00C853" opacity="0.15" stroke="#00C853"/>
      <text x="35" y="48" font-size="36">😊</text>
      <text x="90" y="45" font-size="20" fill="#00C853" font-weight="600">Happy</text>

      <rect x="280" width="140" height="70" rx="35" fill="#F48FB1" opacity="0.15"/>
      <text x="70" y="45" font-size="18" fill="#F48FB1" font-weight="600" text-anchor="middle">#grateful</text>

      <rect x="440" width="140" height="70" rx="35" fill="#6C5CE7" opacity="0.15"/>
      <text x="70" y="45" font-size="18" fill="#8B7BFF" font-weight="600" text-anchor="middle">#family</text>
    </g>

    <!-- Title -->
    <text x="40" y="280" font-size="44" font-weight="700" fill="white">يوم جميل مع العائلة</text>

    <!-- Divider -->
    <line x1="40" y1="310" x2="860" y2="310" stroke="#252B3A" stroke-width="2"/>

    <!-- Content -->
    <text x="40" y="370" font-size="24" fill="white" line-height="1.6">
      <tspan x="40" dy="0">اليوم ذهبنا إلى الحديقة مع الأطفال.</tspan>
      <tspan x="40" dy="45">كان الجو جميلاً، والشمس دافئة.</tspan>
      <tspan x="40" dy="45">شعرت بالسعادة الحقيقية 🥰</tspan>
    </text>

    <!-- Image Thumbnail -->
    <g transform="translate(40, 580)">
      <rect width="200" height="200" rx="16" fill="#252B3A"/>
      <text x="100" y="115" font-size="60" text-anchor="middle">📷</text>
    </g>
    <g transform="translate(260, 580)">
      <rect width="200" height="200" rx="16" fill="#252B3A"/>
      <text x="100" y="115" font-size="60" text-anchor="middle">🌸</text>
    </g>

    <!-- Audio Recorded -->
    <g transform="translate(40, 820)">
      <rect width="820" height="80" rx="20" fill="#6C5CE7" opacity="0.15"/>
      <text x="30" y="50" font-size="32">🎙️</text>
      <text x="90" y="50" font-size="20" fill="#8B7BFF" font-weight="600">Voice note · 0:32</text>
      <text x="700" y="50" font-size="24" fill="#8B7BFF">▶️</text>
    </g>

    <!-- Voice to Text Mode -->
    <g transform="translate(40, 950)">
      <rect width="820" height="200" rx="20" fill="#00D2A8" opacity="0.1" stroke="#00D2A8" stroke-width="2"/>
      <text x="40" y="60" font-size="24" fill="#00D2A8" font-weight="700">🎤 Voice to Text</text>
      <text x="40" y="110" font-size="20" fill="white" font-style="italic">"أنا اليوم سعيد..."</text>

      <!-- Waveform -->
      <g transform="translate(40, 140)">
        <rect x="0" y="20" width="8" height="20" rx="4" fill="#00D2A8"/>
        <rect x="16" y="10" width="8" height="40" rx="4" fill="#00D2A8"/>
        <rect x="32" y="0" width="8" height="60" rx="4" fill="#00D2A8"/>
        <rect x="48" y="15" width="8" height="30" rx="4" fill="#00D2A8"/>
        <rect x="64" y="5" width="8" height="50" rx="4" fill="#00D2A8"/>
        <rect x="80" y="20" width="8" height="20" rx="4" fill="#00D2A8"/>
      </g>
    </g>

    <!-- Save button -->
    <g transform="translate(40, 1200)">
      <rect width="820" height="90" rx="24" fill="#6C5CE7"/>
      <text x="410" y="55" font-size="28" fill="white" font-weight="700" text-anchor="middle">✓ Save Entry</text>
    </g>
  </g>
</svg>
