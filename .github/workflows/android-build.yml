name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  debug-build:
    name: Build debug APK and AAB
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used on manual runs, to attach the APK to a release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # One APK per ABI: the arm64 one is what real phones install, and it is
      # less than half the size of a universal debug APK.
      - name: Build debug APKs
        # The run number as build number, so the phone shows which test
        # build it has (arm64 splits add 2000: build 230 reads 2230).
        run: flutter build apk --debug --split-per-abi --build-number=${{ github.run_number }}
      - name: Build debug AAB
        run: flutter build appbundle --debug --build-number=${{ github.run_number }}
      # A pull request only needs to prove the app builds. Artifacts count
      # against the account's storage quota; when it is full the upload fails
      # although the build succeeded, so an upload failure never fails the job.
      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nabd-debug-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 3
      # Release assets do not use the artifact quota and give a stable link
      # that opens on a phone, so manual runs also publish a pre-release.
      - name: Attach debug APK to a test release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk nabd-debug-arm64.apk
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Nabd test build #${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Not for the store." \
            || true  # the release job may have created it first
          gh release upload "$TAG" nabd-debug-arm64.apk --clobber

  release-build:
    name: Build signed release APK and AAB
    needs: verify
    # The release job is opt-in. It needs the keystore secrets plus the Play
    # product ids, so it must not turn every push red while the store
    # configuration is still being set up.
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && vars.NABD_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used on manual runs, to attach the APK to a release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NABD_PRO_MONTHLY_ID: ${{ vars.NABD_PRO_MONTHLY_ID }}
      NABD_PRO_YEARLY_ID: ${{ vars.NABD_PRO_YEARLY_ID }}
      NABD_LIFETIME_ID: ${{ vars.NABD_LIFETIME_ID }}
      SUBSCRIPTION_VERIFICATION_BACKEND_URL: ${{ vars.SUBSCRIPTION_VERIFICATION_BACKEND_URL }}
      # RevenueCat's public Google key (goog_...): verifies subscriptions.
      REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
      - name: Validate monetization configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NABD_PRO_MONTHLY_ID"
          test -n "$NABD_PRO_YEARLY_ID"
          test -n "$NABD_LIFETIME_ID"
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/nabd-release.jks
          detected_alias="$(keytool -list -v -keystore android/nabd-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^Alias name: //p' | head -n 1)"
          test -n "$detected_alias"
          if [ "$detected_alias" != "$ANDROID_KEY_ALIAS" ]; then
            echo "Configured key alias does not match the keystore; using the keystore alias."
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$detected_alias" \
            "$(pwd)/android/nabd-release.jks" > android/key.properties
          chmod 600 android/nabd-release.jks android/key.properties
      # Play refuses an upload whose versionCode is not higher than the last
      # one, so every release build takes the workflow run number.
      - name: Build signed release APK
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=NABD_PRO_MONTHLY_ID=$NABD_PRO_MONTHLY_ID
          --dart-define=NABD_PRO_YEARLY_ID=$NABD_PRO_YEARLY_ID
          --dart-define=NABD_LIFETIME_ID=$NABD_LIFETIME_ID
          --dart-define=SUBSCRIPTION_VERIFICATION_BACKEND_URL=$SUBSCRIPTION_VERIFICATION_BACKEND_URL
          --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY
          --dart-define=NABD_PRODUCTION_CONFIGURED=true
      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=NABD_PRO_MONTHLY_ID=$NABD_PRO_MONTHLY_ID
          --dart-define=NABD_PRO_YEARLY_ID=$NABD_PRO_YEARLY_ID
          --dart-define=NABD_LIFETIME_ID=$NABD_LIFETIME_ID
          --dart-define=SUBSCRIPTION_VERIFICATION_BACKEND_URL=$SUBSCRIPTION_VERIFICATION_BACKEND_URL
          --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY
          --dart-define=NABD_PRODUCTION_CONFIGURED=true
      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nabd-release-apk
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload release AAB
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nabd-release-aab
          retention-days: 14
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Attach release APK and AAB to the test release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk nabd-release.apk
          # The AAB is what Play Console takes; artifacts expire and count
          # against the quota, a release asset does neither.
          cp build/app/outputs/bundle/release/app-release.aab nabd-release.aab
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Nabd test build #${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Not for the store." \
            || true  # the debug job may have created it first
          gh release upload "$TAG" nabd-release.apk nabd-release.aab --clobber
