name: Render NABD ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/videos/**'
      - '.github/workflows/render-ads.yml'

permissions:
  contents: write

jobs:
  # Artifact storage on the free plan has a hard quota and it is already spent,
  # which made every render job fail after a successful encode. Release assets
  # are not subject to that quota, and they give a plain download link that
  # works from a phone browser. So the release is created once up front and
  # every matrix job attaches its own film to it.
  prepare:
    name: create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nabd-ads-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NABD ads — run ${{ github.run_number }}" \
            --notes "Vertical 1080x1920 story ads. Silent films: the story and the interface carry the meaning." \
            || echo "release $TAG already exists"

  render:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The free runner gives 2 cores; Remotion refuses a concurrency above that.
    # One job per film, so five films still finish in the time of one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Ad1Tonight
            name: ad1-tonight
          - id: Ad2Unsent
            name: ad2-unsent
          - id: Ad3OneDrop
            name: ad3-onedrop
          - id: Ad4TooLoud
            name: ad4-tooloud
          - id: Ad5Year
            name: ad5-year
          - id: FtWarded
            name: ft-warded
    defaults:
      run:
        working-directory: marketing/videos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: marketing/videos/package-lock.json

      - name: Optional system packages
        timeout-minutes: 10
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=5 || true
          sudo apt-get install -y -o Acquire::Retries=5 ffmpeg || true
          command -v ffmpeg && ffmpeg -version | head -1 || echo "no system ffmpeg — Remotion uses its own"

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Render ${{ matrix.id }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ matrix.id }}" "out/${{ matrix.name }}.mp4" \
            --codec=h264 --crf=16 --pixel-format=yuv420p --concurrency=2 --log=error
          ls -lh out/

      - name: Attach film to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh "out/${{ matrix.name }}.mp4"
          gh release upload "nabd-ads-${{ github.run_number }}" \
            "out/${{ matrix.name }}.mp4" \
            --repo "${{ github.repository }}" \
            --clobber
