name: Render NABD ads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/videos/**'
      - '.github/workflows/render-ads.yml'

permissions:
  contents: write

jobs:
  render:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The free runner gives 2 cores; Remotion refuses a concurrency above that.
    # One job per film, so five films still finish in the time of one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Ad1Tonight
            name: ad1-tonight
          - id: Ad2Unsent
            name: ad2-unsent
          - id: Ad3OneDrop
            name: ad3-onedrop
          - id: Ad4TooLoud
            name: ad4-tooloud
          - id: Ad5Year
            name: ad5-year
    defaults:
      run:
        working-directory: marketing/videos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: marketing/videos/package-lock.json

      - name: Optional system packages
        timeout-minutes: 10
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=5 || true
          sudo apt-get install -y -o Acquire::Retries=5 ffmpeg || true
          command -v ffmpeg && ffmpeg -version | head -1 || echo "no system ffmpeg — Remotion uses its own"

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Render ${{ matrix.id }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ matrix.id }}" "out/${{ matrix.name }}.mp4" \
            --codec=h264 --crf=16 --pixel-format=yuv420p --concurrency=2 --log=error
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: ad-${{ matrix.name }}
          path: marketing/videos/out/${{ matrix.name }}.mp4
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ad-*
          merge-multiple: true
          path: dist

      - name: List
        run: ls -lh dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -e
          TAG="nabd-ads-$RUN"
          gh release create "$TAG" dist/*.mp4 \
            --repo "$REPO" \
            --target "$SHA" \
            --title "NABD ads — wordless feature films (run $RUN)" \
            --notes "Five vertical 1080x1920 story ads. No on-screen copy: the story and the interface carry the meaning."
