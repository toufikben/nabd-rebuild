plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.nabd.journal"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.nabd.journal"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // A QA key committed with the project, so a debug build from CI and a
        // debug build from a laptop carry the same signature: `adb install -r`
        // then keeps the journal instead of demanding an uninstall first.
        // Debug/QA only — it can never sign a Play upload.
        debug {
            storeFile file('qa-debug.keystore')
            storePassword 'nabdqa'
            keyAlias 'nabdqa'
            keyPassword 'nabdqa'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Without key.properties the release config has no signing config,
            // and AGP would fall back to signing with the committed QA debug
            // key. Such an artifact can never be uploaded to Play and would
            // burn the package name on first install, so assembling a release
            // without the keystore fails loudly (see the guard below) instead
            // of silently producing a dead APK.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    // Guards a store artifact from being built with the QA debug key. Debug
    // builds stay untouched, so a laptop without the keystore still works.
    gradle.taskGraph.whenReady { graph ->
        def buildingRelease = graph.allTasks.any {
            it.name == 'assembleRelease' ||
            it.name == 'bundleRelease' ||
            it.name.startsWith('packageRelease')
        }
        if (buildingRelease && !keystorePropertiesFile.exists()) {
            throw new GradleException(
                "Release build needs android/key.properties. Refusing to sign " +
                "a store artifact with the committed QA debug key."
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // in_app_purchase_android ships Billing 8.0.0; Gradle takes the highest
    // version on the classpath, so this lifts the whole app to the newest
    // Play Billing. 9.x removed nothing the plugin calls (release notes).
    implementation "com.android.billingclient:billing:9.1.0"
}
