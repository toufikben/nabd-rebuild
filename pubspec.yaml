name: nabd
description: Pulse — your private fully local journal
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # Cryptography (AES-256-GCM)
  cryptography: ^2.7.0

  # UI
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Media
  image_picker: ^1.1.2
  record: ^6.1.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Security
  crypto: ^3.0.5
  local_auth: ^2.3.0

  # Files
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  archive: ^3.6.1

  # Monetization
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0

  # Sound
  just_audio: ^0.9.36

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A0D14"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#0A0D14"
    theme_color: "#6C5CE7"

flutter_native_splash:
  color: "#0A0D14"
  image: assets/icons/splash.png
  color_dark: "#0A0D14"
  image_dark: assets/icons/splash.png
  android_12:
    image: assets/icons/splash.png
    color: "#0A0D14"
    icon_background_color: "#6C5CE7"
  ios: true
  web: true
  fullscreen: true
